{{- $policy := .Values.runtimeNetworkPolicy | default dict }}
{{- if $policy.enabled }}
{{- $sandbox := $policy.sandbox | default dict }}
{{- /* Mutually exclusive with the opensandbox-server sandbox-egress-public-only
       policy: NetworkPolicy allow rules are OR-ed across policies, so keeping
       this allow-all alongside the restricted fence would void the fence. The
       exclusion only applies when both policies target the same namespace —
       allow rules never combine across namespaces, so an allow-all deliberately
       serving a different namespace must keep rendering. Rendering is skipped
       here, but `kubectl apply` never prunes — on an existing cluster the stale
       allow-all must be deleted once by hand. */}}
{{- $serverValues := index .Values "opensandbox-server" | default dict }}
{{- $restrictedEgress := dig "server" "sandboxNetworkPolicy" "enabled" false $serverValues }}
{{- $fenceNamespace := dig "server" "gateway" "dataplaneNamespace" "teable-sandbox" $serverValues }}
{{- $allowAllNamespace := $sandbox.namespace | default ((.Values.sandboxNamespace).name | default "teable-sandbox") }}
{{- $fenceSupersedes := and $restrictedEgress (eq $fenceNamespace $allowAllNamespace) }}
{{- /* `default` swallows an explicit boolean false (Sprig treats false as empty),
       so gate on key presence to honor `enabled: false`. */}}
{{- $sandboxEnabled := ternary $sandbox.enabled true (hasKey $sandbox "enabled") }}
{{- if and $sandboxEnabled (not $fenceSupersedes) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: teable-sandbox-allow-all-egress
  {{- /* Follow the dataplane namespace knob: an independent default here drifts
         from sandboxNamespace.name on rename (2026-07-26 EKS incident: policy
         kept applying into the pruned teable-sandbox namespace). */}}
  namespace: {{ $sandbox.namespace | default ((.Values.sandboxNamespace).name | default "teable-sandbox") | quote }}
  labels:
    app.kubernetes.io/name: teable-sandbox-egress
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: opensandbox
spec:
  podSelector:
    matchExpressions:
      - key: opensandbox.io/id
        operator: Exists
  policyTypes:
    - Egress
  egress:
    - {}
---
{{- end }}
{{- $appRuntime := $policy.appRuntime | default dict }}
{{- $appRuntimeEnabled := ternary $appRuntime.enabled true (hasKey $appRuntime "enabled") }}
{{- if $appRuntimeEnabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: teable-app-runtime-allow-all-egress
  namespace: {{ $appRuntime.namespace | default "app-deploy" | quote }}
  labels:
    app.kubernetes.io/name: teable-app-runtime-egress
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: opensandbox
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: teable-app-runtime
  policyTypes:
    - Egress
  egress:
    - {}
{{- end }}
{{- end }}
